[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"

# Vite/React is a single-page app. A direct visit to an application route must
# serve index.html so React Router can render the correct page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
